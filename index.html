<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>if(location.protocol!=="https:"){location.replace("https://"+location.host+location.pathname+location.search);}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phantom Flash</title>
  <meta name="description" content="Help is on the way, I just haven’t gotten to you yet.">
  <meta property="og:title" content="Phantom Flash">
  <meta property="og:description" content="Help is on the way, I just haven’t gotten to you yet.">
  <meta property="og:image" content="assets/phantomflash-landing-title-v4.jpg">
  <style>
    html, body { margin: 0; min-height: 100%; background: #05050a; }
    body { display: grid; place-items: center; overflow-x: hidden; }
    .landing { width: min(100vw, 980px); min-height: 100vh; display: grid; place-items: center; padding: clamp(10px, 2vw, 24px); box-sizing: border-box; }
    img { width: 100%; max-height: calc(100vh - 32px); object-fit: contain; display: block; border-radius: 18px; box-shadow: 0 0 60px rgba(0, 229, 255, .22), 0 30px 120px rgba(0,0,0,.8); }
    @media (max-width: 700px) { .landing { min-height: 100svh; padding: 8px; } img { border-radius: 10px; width: 100%; height: auto; max-height: calc(100svh - 16px); object-fit: contain; } }
  </style>
</head>
<body>
  <main class="landing">
    <img src="assets/phantomflash-landing-title-v4.jpg" alt="Phantom Flash — Help is on the way, I just haven’t gotten to you yet.">
  </main>
</body>
</html>
